name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default — this workflow only reads the repo and writes
# nothing back, so it needs no more than that.
permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Fails the job on any high/critical advisory in the dependency tree —
      # catches new criticals the moment they land, instead of only when
      # someone happens to run `npm audit` by hand.
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
