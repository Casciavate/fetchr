[functions.email-import]
enabled = true
verify_jwt = false # public webhook target for SendGrid Inbound Parse — no user session
import_map = "./functions/email-import/deno.json"
entrypoint = "./functions/email-import/index.ts"

[functions.delete-account]
enabled = true
verify_jwt = true
entrypoint = "./functions/delete-account/index.ts"

[functions.bot-agent]
enabled = true
verify_jwt = false # invoked by the bot-agent-tick pg_cron job via pg_net, which sends no auth header
import_map = "./functions/bot-agent/deno.json"
entrypoint = "./functions/bot-agent/index.ts"

[functions.stripe-identity]
enabled = true
verify_jwt = false # Stripe posts /webhook directly; that path authenticates via Stripe's signature
import_map = "./functions/stripe-identity/deno.json"
entrypoint = "./functions/stripe-identity/index.ts"
