# Linked project. With this set, every CLI command below works from a bare
# `npx supabase <cmd>` in this repo — no --project-ref to remember and no
# chance of pointing a migration or a deploy at the wrong project.
project_id = "jvuzjmigkqolphkhzeei"

# IMPORTANT: every function that lives in supabase/functions/ must have an
# entry here. `supabase functions deploy` reads verify_jwt from this file,
# and its default is true — so a function omitted here gets redeployed with
# JWT verification ON. For bot-agent (called by pg_cron via pg_net with no
# auth header) and stripe-identity (Stripe posts the webhook directly, and
# authenticates itself by signature instead) that would silently break them.


[functions.create-payment]
enabled = true
verify_jwt = true
import_map = "./functions/create-payment/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-payment/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-payment/*.html" ]

[functions.flight-search]
enabled = true
verify_jwt = true
import_map = "./functions/flight-search/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/flight-search/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/flight-search/*.html" ]

